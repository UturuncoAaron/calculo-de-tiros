<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCT - FDC MASTER</title>

    <script src="lib/proj4.js"></script>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>SCT - SISTEMA DE CONTROL DE TIRO (FDC)</h1>
        <div class="top-controls">
            <div>
                <label>COORDENADAS:</label>
                <select id="inputMode">
                    <option value="utm">UTM (METROS)</option>
                    <option value="dms">GRADOS MINUTOS</option>
                </select>
            </div>
            <div>
                <label>MUNICIÓN:</label>
                <select id="tipoGranada">
                    <option value="W87">CHINA - W87 (81mm)</option>
                    <option value="M43">USA - M43A1 (81mm)</option>
                    <option value="O832">RUSIA - O-832 (82mm)</option>
                </select>
            </div>
        </div>
    </header>

    <div class="grid-container">

        <div class="panel panel-left">

            <div class="box-section">
                <div class="box-title">1. POSICIÓN MORTERO (M)</div>
                <div id="mortero-utm" class="input-row">
                    <input type="number" id="mx" placeholder="Este (X)">
                    <input type="number" id="my" placeholder="Norte (Y)">
                </div>
                <div id="mortero-dms" class="hidden">
                    <div class="input-row">
                        <input type="number" id="mlat_d" placeholder="Lat Gr"><input type="number" id="mlat_m"
                            placeholder="Min"><input type="number" id="mlat_s" placeholder="Seg">
                    </div>
                    <div class="input-row">
                        <input type="number" id="mlon_d" placeholder="Lon Gr"><input type="number" id="mlon_m"
                            placeholder="Min"><input type="number" id="mlon_s" placeholder="Seg">
                    </div>
                </div>

                <div class="input-row">
                    <label style="color:#00ffff;">Alt. Pieza:</label>
                    <input type="number" id="alt_pieza" placeholder="Metros"
                        style="color:#00ffff; border-color:#00ffff;">
                </div>
            </div>

            <div class="box-section">
                <div class="box-title">2. POSICIÓN OBJETIVO (T)</div>
                <div id="target-utm" class="input-row">
                    <input type="number" id="tx" placeholder="Este (X)">
                    <input type="number" id="ty" placeholder="Norte (Y)">
                </div>
                <div id="target-dms" class="hidden">
                    <div class="input-row">
                        <input type="number" id="tlat_d" placeholder="Lat Gr"><input type="number" id="tlat_m"
                            placeholder="Min"><input type="number" id="tlat_s" placeholder="Seg">
                    </div>
                    <div class="input-row">
                        <input type="number" id="tlon_d" placeholder="Lon Gr"><input type="number" id="tlon_m"
                            placeholder="Min"><input type="number" id="tlon_s" placeholder="Seg">
                    </div>
                </div>

                <div class="input-row">
                    <label style="color:#00ffff;">Alt. Objetivo:</label>
                    <input type="number" id="alt_obj" placeholder="Metros" style="color:#00ffff; border-color:#00ffff;">
                </div>
            </div>

            <div class="box-section obs-box">
                <div class="box-title">3. OBSERVADOR (Opcional)</div>
                <div id="obs-utm" class="input-row">
                    <input type="number" id="ox" placeholder="Obs Este">
                    <input type="number" id="oy" placeholder="Obs Norte">
                </div>
                <div id="obs-dms" class="hidden">
                    <div class="input-row">
                        <input type="number" id="olat_d" placeholder="Lat Gr"><input type="number" id="olat_m"
                            placeholder="Min"><input type="number" id="olat_s" placeholder="Seg">
                    </div>
                    <div class="input-row">
                        <input type="number" id="olon_d" placeholder="Lon Gr"><input type="number" id="olon_m"
                            placeholder="Min"><input type="number" id="olon_s" placeholder="Seg">
                    </div>
                </div>

                <div class="input-row dashed-top">
                    <input type="number" id="distObs" placeholder="Distancia (m)">
                    <input type="number" id="azObs" placeholder="Azimut (Mils)">
                </div>
                <button id="btnCalcularObs" class="btn-small">CALCULAR POS. OBJETIVO</button>
            </div>

        </div>

        <div class="panel panel-center">

            <button id="btnFuego" class="btn-large">¡CALCULAR DATOS DE TIRO!</button>

            <div id="balistica" class="display-screen">
                <div class="screen-header">SOLUCIÓN DE FUEGO</div>

                <div class="data-group-main">
                    <div class="data-item">
                        <span class="label">AZIMUT (MILS 6400)</span>
                        <span id="resAzimutMils" class="value-huge blink">0000</span>
                    </div>
                </div>

                <div class="data-grid-secondary">
                    <div class="data-item">
                        <span class="label">CARGA</span>
                        <span id="bal_carga" class="value-large text-yellow">-</span>
                    </div>
                    <div class="data-item">
                        <span class="label">ELEVACIÓN</span>
                        <span id="bal_elev" class="value-large text-yellow">0000</span>
                    </div>
                    <div class="data-item">
                        <span class="label">TIEMPO (s)</span>
                        <span id="bal_time" class="value-large">00.0</span>
                    </div>
                    <div class="data-item">
                        <span class="label">DISTANCIA (m)</span>
                        <span id="resDist" class="value-large">0</span>
                    </div>
                </div>
                <div class="footer-info">Azimut en grados: <span id="resAzimutDeg">0.0°</span></div>
            </div>

            <div id="correcciones" class="correction-panel">
                <div class="box-title-red">CORRECCIONES (REGLAJE)</div>
                <div class="corr-grid">
                    <div>
                        <label>DESVIACIÓN (MILS)</label>
                        <div class="input-group">
                            <select id="corr_dir">
                                <option value="right">Der (R)</option>
                                <option value="left">Izq (L)</option>
                            </select>
                            <input type="number" id="corr_mils" placeholder="Mils">
                        </div>
                    </div>
                    <div>
                        <label>ALCANCE (METROS)</label>
                        <div class="input-group">
                            <select id="corr_range">
                                <option value="over">Largo (+)</option>
                                <option value="short">Corto (-)</option>
                            </select>
                            <input type="number" id="corr_metros" placeholder="Metros">
                        </div>
                    </div>
                </div>
                <button id="btnCorregir" class="btn-red">APLICAR CORRECCIÓN</button>
            </div>

        </div>

        <div class="panel panel-right">

            <div class="radar-container">
                <canvas id="radarCanvas" width="400" height="400"></canvas>
                <div class="radar-overlay">RADAR DE TIRO</div>
            </div>

            <div class="box-section meteo-section">
                <div class="box-title title-cyan">DATOS ATMOSFÉRICOS</div>

                <div class="meteo-grid-inputs">

                    <div class="input-block">
                        <label>VIENTO (DIR°)</label>
                        <input type="number" id="meteo_dir" placeholder="0" class="input-cyan">
                    </div>

                    <div class="input-block">
                        <label>VELOC. (m/s)</label>
                        <input type="number" id="meteo_vel" placeholder="0" class="input-cyan">
                    </div>

                    <div class="input-block">
                        <label>TEMP. AIRE (°C)</label>
                        <input type="number" id="meteo_temp" value="15" class="input-cyan">
                    </div>

                    <div class="input-block">
                        <label>PRESIÓN (mmHg)</label>
                        <input type="number" id="meteo_presion" value="750" class="input-cyan">
                    </div>

                    <div class="input-block">
                        <label>TEMP. CARGA (°C)</label>
                        <input type="number" id="meteo_temp_carga" value="15" class="input-cyan">
                    </div>

                    <div class="input-block">
                        <label>DIF. PESO (+/-)</label>
                        <input type="number" id="meteo_peso" value="0" class="input-cyan">
                    </div>

                </div>
            </div>

        </div>

    </div>

    <script src="js/database.js"></script>
    <script src="js/balistica.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
