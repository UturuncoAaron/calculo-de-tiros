<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORTEROS-MARIA V17.0 (FINAL LIMA)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="laptop-bezel">
        <div class="screen-container">

            <header class="screen-header">
                <div class="header-left">
                    <div class="status-led online" id="conn-status"></div>
                    <h1>MORTEROS-MARIA // SISTEMA DE TIRO</h1>
                </div>
                <div class="header-right">
                    <div class="mini-control">
                        <label>SISTEMA</label>
                        <select id="inputMode">
                            <option value="utm">UTM</option>
                        </select>
                    </div>
                    <div class="mini-control">
                        <label>MUNICIÓN</label>
                        <select id="tipoGranada">
                            <option value="W87">W87 (China 81mm)</option>
                            <option value="M43">M43 (USA 81mm)</option>
                        </select>
                    </div>
                    <div class="battery-indicator">BAT 100%</div>
                </div>
            </header>

            <div class="main-split-layout" id="main-layout">

                <div class="left-zone" id="left-zone">

                    <div class="radar-viewer-large" id="map-container">
                        <div id="map"></div>
                        <canvas id="radarCanvas"></canvas>
                        <div class="radar-overlay-info"><span id="mode-indicator">SYSTEM READY - LIMA MODE</span></div>
                    </div>

                    <div class="resizer-h" id="resizer-h">
                        <div class="grip-lines"></div>
                    </div>

                    <div class="bottom-inputs-grid" id="bottom-panel">

                        <div class="input-card">
                            <div class="card-header text-green">1. POSICIONES</div>
                            <div class="card-body vertical-stack">
                                <div class="group-box">
                                    <label class="group-label">MORTERO (M)</label>
                                    <div class="input-row-3">
                                        <input type="number" id="mx" placeholder="Este X">
                                        <input type="number" id="my" placeholder="Norte Y">
                                        <input type="number" id="alt_pieza" placeholder="Alt" class="mini-input">
                                    </div>
                                </div>
                                <div class="group-box">
                                    <label class="group-label text-red">OBJETIVO (T)</label>
                                    <div class="input-row-3">
                                        <input type="number" id="tx" placeholder="Este X">
                                        <input type="number" id="ty" placeholder="Norte Y">
                                        <input type="number" id="alt_obj" placeholder="Alt" class="mini-input">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="input-card">
                            <div class="card-header text-cyan">2. OBSERVADOR</div>
                            <div class="card-body vertical-stack">
                                <div class="group-box">
                                    <label class="group-label">UBICACIÓN OBS</label>
                                    <div class="input-row-2">
                                        <input type="number" id="ox" placeholder="Este">
                                        <input type="number" id="oy" placeholder="Norte">
                                    </div>
                                </div>
                                <div class="divider"></div>
                                <div class="group-box">
                                    <label class="group-label">VECTORES</label>
                                    <div class="input-row-3-mixed">
                                        <input type="number" id="distObs" placeholder="Dist (m)">
                                        <input type="number" id="azObs" placeholder="Azimut">
                                        <select id="azObsUnit" class="mini-select">
                                            <option value="mils">MIL</option>
                                            <option value="deg">GRD</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="input-card wide-card">
                            <div class="card-header text-yellow">3. DATOS BALÍSTICOS & METEO</div>
                            <div class="card-body vertical-stack tight-gap">
                                <div class="bal-row">
                                    <div class="bal-field"><label>VIENTO (DIR°)</label><input type="number"
                                            id="meteo_dir" value="196"></div>
                                    <div class="bal-field"><label>VEL (m/s)</label><input type="number" id="meteo_vel"
                                            value="4.5"></div>
                                    <div class="bal-field"><label>TEMP AIRE</label><input type="number" id="meteo_temp"
                                            value="17.2"></div>
                                    <div class="bal-field"><label>PRESIÓN</label><input type="number" id="meteo_pres"
                                            value="746.4"></div>
                                </div>

                                <div class="bal-row">
                                    <div class="bal-field"><label>TEMP CARGA</label><input type="number" id="temp_carga"
                                            value="15"></div>
                                    <div class="bal-field"><label>DIF PESO</label><input type="number" id="dif_peso"
                                            value="0"></div>
                                    <div class="bal-field"><label>DIF V. INICIAL</label><input type="number"
                                            id="dif_vel" value="0"></div>
                                </div>

                                <div class="geo-bar">
                                    <div class="tiny-field"><label>FECHA</label><input type="date" id="fecha_tiro">
                                    </div>
                                    <div class="tiny-field"><label>ZONA</label><input type="number" id="zona_utm"
                                            value="18"></div>

                                    <div class="var-container">
                                        <div class="var-data">
                                            <label>VARIACIÓN CALC</label>
                                            <input type="text" id="input_variacion" value="-3.52" readonly>
                                        </div>
                                        <div class="switch-wrapper">
                                            <label class="switch-container">
                                                <input type="checkbox" id="check_bloqueo">
                                                <span class="slider"></span>
                                            </label>
                                            <span id="lock-text">LIBRE</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="resizer-v" id="resizer-v"></div>

                <div class="right-sidebar" id="right-sidebar">

                    <div class="sidebar-section orient-box">
                        <label class="section-label text-amber">ORIENTACIÓN INICIAL (MILS)</label>
                        <input type="number" id="orientacion_base" class="big-input-amber" placeholder="Ej: 6400">
                    </div>

                    <div class="lcd-panel">
                        <span class="lcd-label">AZIMUT DE TIRO</span>
                        <span id="resAzimutMils" class="lcd-value">0000</span>
                        <div class="lcd-sub">MAGNÉTICO: <span id="resAzimutMag" class="text-white">0000</span></div>
                    </div>

                    <div class="sidebar-section">
                        <label class="section-label">CARGA</label>
                        <select id="sel_carga" class="big-select">
                            <option>-</option>
                        </select>
                        <div id="recomendacion-msg" class="rec-msg hidden"></div>
                    </div>

                    <div class="sidebar-section">
                        <label class="section-label">COMANDOS</label>
                        <div class="cmd-grid-sidebar">
                            <div class="cmd-cell"><span class="lbl">ORIENT</span><span class="val"
                                    id="cmd_orient">-</span></div>
                            <div class="cmd-cell hl-green"><span class="lbl">DERIVA</span><span class="val text-green"
                                    id="cmd_deriva">-</span></div>
                            <div class="cmd-cell hl-yellow"><span class="lbl">ELEVACIÓN</span><span
                                    class="val text-yellow" id="cmd_elev">-</span></div>
                            <div class="cmd-cell"><span class="lbl">TIEMPO</span><span class="val"
                                    id="cmd_time">-</span></div>
                            <div class="cmd-cell full"><span class="lbl">ALCANCE TOTAL</span><span class="val"
                                    id="cmd_dist">-</span></div>
                        </div>
                    </div>

                    <div class="sidebar-section correction-box-styled">
                        <div class="correction-header">
                            <label class="section-label text-red-alert">REGLAJE DE TIRO</label>
                            <select id="metodo_reglaje" class="method-select-styled">
                                <option value="apreciacion">MÉTODO 1: APRECIACIÓN</option>
                                <option value="medicion">MÉTODO 2: MEDICIÓN</option>
                            </select>
                        </div>

                        <div id="inputs_apreciacion" class="corr-body">
                            <div class="corr-row">
                                <div class="corr-field wide">
                                    <label>DIRECCIÓN (OBS)</label>
                                    <select id="corr_dir" class="red-input-styled">
                                        <option value="right">DERECHA</option>
                                        <option value="left">IZQUIERDA</option>
                                    </select>
                                </div>
                                <div class="corr-field">
                                    <label>VALOR</label>
                                    <input type="number" id="corr_lat_val" placeholder="0" class="red-input-styled">
                                </div>
                                <div class="corr-field narrow">
                                    <label>UNIDAD</label>
                                    <select id="corr_lat_unit" class="red-select-styled">
                                        <option value="m">mts</option>
                                        <option value="mils">mil</option>
                                    </select>
                                </div>
                            </div>
                            <div class="divider-red"></div>
                            <div class="corr-row">
                                <div class="corr-field wide">
                                    <label>ALCANCE (OBS)</label>
                                    <select id="corr_range" class="red-input-styled">
                                        <option value="over">LARGO (+)</option>
                                        <option value="short">CORTO (-)</option>
                                    </select>
                                </div>
                                <div class="corr-field wide">
                                    <label>METROS</label>
                                    <input type="number" id="corr_metros" placeholder="0" class="red-input-styled">
                                </div>
                            </div>
                        </div>

                        <div id="inputs_medicion" class="corr-body hidden">
                            <div class="corr-row">
                                <div class="corr-field wide">
                                    <label>AZIMUT IMPACTO</label>
                                    <input type="number" id="impacto_az" placeholder="0000" class="red-input-styled">
                                </div>
                                <div class="corr-field narrow">
                                    <label>UNIDAD</label>
                                    <select id="impacto_az_unit" class="red-select-styled">
                                        <option value="mils">MIL</option>
                                        <option value="deg">°</option>
                                    </select>
                                </div>
                            </div>
                            <div class="corr-row mt-2">
                                <div class="corr-field full">
                                    <label>DISTANCIA AL IMPACTO (Metros)</label>
                                    <input type="number" id="impacto_dist" placeholder="Ej: 3150"
                                        class="red-input-styled">
                                </div>
                            </div>
                        </div>

                        <button id="btnCorregir" class="btn-sidebar-action-red">APLICAR CORRECCIÓN</button>
                    </div>

                    <div class="sidebar-section flexible-height history-container-styled">
                        <label class="section-label">REGISTRO DE DISPAROS</label>
                        <div id="lista-historial" class="history-list-styled">
                            <div class="history-placeholder">Esperando datos...</div>
                        </div>

                        <button id="btnGuardarManual" class="btn-save-styled">💾 GUARDAR MISIÓN ACTUAL</button>

                        <button id="btnResetHistorial" class="btn-reset-styled">BORRAR REGISTRO</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/balistica.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
